<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List</title>
</head>
<body>
    <ol type="1">
        <li>Movie 1
            <ol type="a">
                <li>Heroes
                    <ul type="circle">
                        <li>Actor 1</li>
                        <li>Actor 2</li>
                        <li>Actor 3</li>
                    </ul>
                </li>
                <li>Heroine
                    <ol type="disc">
                        <li>Actress 1</li>
                        <li>Actress 2</li>
                    </ol>
                </li>
            </ol>
        </li>
        <li>Movie 2
            <ol type="a">
                <li>Heroes
                    <ul type="circle">
                        <li>Actor 4</li>
                        <li>Actor 5</li>
                        <li>Actor 6</li>
                    </ul>
                </li>
                <li>Heroine
                    <ol type="disc">
                        <li>Actress 3</li>
                        <li>Actress 4</li>
                    </ol>
                </li>
            </ol>
        </li>
    </ol>
    
</body>
</html>
